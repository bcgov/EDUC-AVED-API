name: API CI

on:
  workflow_dispatch:
  push:
    branches:
      - master
      - 'feature/**'
      - 'Feature/**'
      - 'fix/*'
      - 'Fix/*'
    paths:
      - 'api/**'
      - 'Dockerfile'
      - '.github/workflows/*'
  pull_request:
    branches: [ master ]
    paths:
      - 'api/**'
      - 'Dockerfile'
      - '.github/workflows/*'
jobs:
  quality_profile:

    runs-on: ubuntu-latest
    env:
      MAVEN_REPO_LOCAL: ${{ github.workspace }}/.m2/repository

    defaults:
      run:
        working-directory: api

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Shallow clones should be disabled for a better relevancy of analysis
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'corretto'
          java-version: '21'
          check-latest: true
      - name: Reset local Maven repository
        run: rm -rf "$MAVEN_REPO_LOCAL"
      - name: Print Java and Maven versions
        run: mvn -Dmaven.repo.local="$MAVEN_REPO_LOCAL" -v
      - name: Run unit tests
        run: mvn -Dmaven.repo.local="$MAVEN_REPO_LOCAL" -f pom.xml clean package
      - name: Run Sonar Analysis
        run: mvn -Dmaven.repo.local="$MAVEN_REPO_LOCAL" sonar:sonar
          -Dsonar.token=${{ secrets.SONAR_TOKEN }}
          -Dsonar.host.url=https://sonarcloud.io
          -Dsonar.organization=bcgov-sonarcloud
          -Dsonar.projectKey=${{ secrets.SONAR_PROJECT_KEY }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
